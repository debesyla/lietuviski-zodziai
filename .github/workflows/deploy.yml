name: Deploy

# Push to main -> verify and build the SvelteKit site -> rsync it over SSH.
# Host, port, user, key and path details come from the `production`
# environment secrets. The remote directory must be marked by hand first.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zodziai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dago.lt/zodziai/
    permissions:
      contents: read
    env:
      MARKER: .deploy-marker-zodziai
      SITE: https://dago.lt/zodziai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run check
          npm test
          npm run products:verify
          npm run public:verify

      - name: Build production artifact
        env:
          NODE_ENV: production
          BASE_PATH: /zodziai
          PUBLIC_SITE_URL: https://dago.lt/zodziai
        run: |
          set -euo pipefail
          npm run build

          # This live build ID proves that rsync updated the directory served
          # at SITE, rather than successfully creating a mistyped sibling.
          printf '%s\n' "$GITHUB_SHA" > build/BUILD

          for file in .htaccess index.html apie.html robots.txt sitemap.xml \
                      data-products/catalog.json BUILD; do
            test -f "build/$file" \
              || { echo "::error::production artifact is missing $file"; exit 1; }
          done

          grep -q 'https://dago.lt/zodziai/' build/index.html \
            || { echo "::error::homepage metadata does not use the production URL"; exit 1; }
          grep -q 'href="./apie"' build/index.html \
            || { echo "::error::homepage links are not rooted at the configured base path"; exit 1; }

          echo "Artifact contains $(find build -type f | wc -l | tr -d ' ') files."

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -euo pipefail

          for variable in DEPLOY_SSH_KEY SSH_HOST SSH_USER SSH_PORT \
                          SSH_KNOWN_HOSTS REMOTE_DIR; do
            value="${!variable:-}"
            test -n "$value" \
              || { echo "::error::$variable secret is empty or unset"; exit 1; }
          done

          case "$REMOTE_DIR" in
            */zodziai) ;;
            *) echo "::error::REMOTE_DIR must end in /zodziai"; exit 1 ;;
          esac

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the independently verified host key. Runtime keyscanning would
          # silently trust whichever server answered the connection.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      # Refuse to run --delete against a path that was not explicitly marked.
      - name: Guard - target marker must exist
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          set -uo pipefail

          if error="$(ssh deploy-target "test -f '$REMOTE_DIR/$MARKER'" 2>&1 >/dev/null)"; then
            status=0
          else
            status=$?
          fi

          case "$status" in
            0)
              echo "Marker present - target confirmed."
              ;;
            1)
              echo "::error::$MARKER is absent from the target; refusing to deploy"
              echo "::error::Create it by hand in the prepared zodziai directory."
              exit 1
              ;;
            255)
              echo "::error::SSH could not reach the deploy host: ${error:-no stderr output}"
              exit 1
              ;;
            *)
              echo "::error::Marker check exited $status: ${error:-no stderr output}"
              exit 1
              ;;
          esac

      - name: Dry run
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          rsync -a --checksum --delete --itemize-changes --dry-run \
            --exclude "$MARKER" \
            --exclude '.well-known/' \
            -e "ssh -F $HOME/.ssh/config" \
            build/ "deploy-target:$REMOTE_DIR/"

      - name: Deploy
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
        run: |
          # Checkout times change on every runner, so checksums prevent a full
          # re-upload when file contents have not changed.
          rsync -a --checksum --delete --itemize-changes \
            --exclude "$MARKER" \
            --exclude '.well-known/' \
            -e "ssh -F $HOME/.ssh/config" \
            build/ "deploy-target:$REMOTE_DIR/"

      - name: Smoke test
        run: |
          set -euo pipefail
          sleep 2

          fetch() {
            local url="$1" destination="$2" status
            status="$(curl -sS --max-time 20 -o "$destination" -w '%{http_code}' "$url")" || {
              echo "::error::GET $url failed to complete (network/TLS)"
              exit 1
            }
            case "$status" in
              2*) ;;
              *) echo "::error::GET $url returned HTTP $status"; exit 1 ;;
            esac
          }

          fetch "$SITE/BUILD" /tmp/zodziai-BUILD
          deployed_sha="$(cat /tmp/zodziai-BUILD)"
          test "$deployed_sha" = "$GITHUB_SHA" \
            || { echo "::error::live BUILD=$deployed_sha, expected $GITHUB_SHA"; exit 1; }

          fetch "$SITE/" /tmp/zodziai-index.html
          grep -q 'Dažniausi lietuviški žodžiai' /tmp/zodziai-index.html \
            || { echo "::error::homepage did not serve expected content"; exit 1; }

          # This extensionless route depends on the deployed Apache rewrite.
          fetch "$SITE/apie" /tmp/zodziai-apie.html
          grep -q 'Metodika ir šaltiniai' /tmp/zodziai-apie.html \
            || { echo "::error::methodology page did not serve expected content"; exit 1; }

          fetch "$SITE/data-products/catalog.json" /tmp/zodziai-catalog.json
          test -s /tmp/zodziai-catalog.json \
            || { echo "::error::public data-product catalog is empty"; exit 1; }

          echo "Deployed $GITHUB_SHA to $SITE/"
